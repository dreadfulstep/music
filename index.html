<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="start-overlay">
      <div class="modal">
        <h1>Music Studio</h1>
        <p class="tagline">Keyboard-first music production.</p>
        <p class="blurb">
          Sequence synths. Record vocals. Mix tracks.
          All without touching your mouse, or the Tab key.
        </p>
        <div class="kbd-hint">
            <span class="key-cap">Space</span> to play .
            <span class="key-cap">A-K</span> to jam
        </div>
        <div class="cta">Click anywhere to start</div>
      </div>
    </div>

    <div id="keys"></div>

    <div id="status">
      <span id="bpm-display">BPM: 120</span>
      <span id="preset-display">Preset: pluck</span>
      <span id="track-display">Track: 1 Lead</span>
      <span id="play-state">Stopped</span>
    </div>
  </body>
</html>
